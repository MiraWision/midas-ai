services:
  db:
    image: postgres:16-alpine
    restart: unless-stopped
    environment:
      POSTGRES_USER: midas
      POSTGRES_PASSWORD: midas
      POSTGRES_DB: midas
    ports:
      # Override with MIDAS_DB_PORT in .env if 5432 is taken on your machine.
      - '${MIDAS_DB_PORT:-5432}:5432'
    volumes:
      - midas-pgdata:/var/lib/postgresql/data

volumes:
  midas-pgdata:
